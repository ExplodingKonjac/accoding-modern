<!doctype html>
<html lang="zh-CN" class="am">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>题目语言设置 · 本地预览</title>
<style>
/* Native Bootstrap float/clearfix and iCheck geometry from the edit page. */
*{box-sizing:border-box}body{margin:0;font:14px/1.42857143 sans-serif;background:#777}label{display:inline-block;max-width:100%;margin-bottom:5px;font-weight:700}.text-right{text-align:right}.text-left{text-align:left}
.form-group{margin:0 -15px 15px}.form-group:before,.form-group:after{display:table;content:' '}.form-group:after{clear:both}
[class*=col-]{position:relative;min-height:1px;padding:0 15px;float:left}.col-xs-3{width:25%}.col-xs-4{width:33.33333333%}.col-xs-6{width:50%}.form-control{display:block;width:100%;height:34px;padding:6px 12px;border:1px solid #ccc}.control-label{padding-top:7px;margin-bottom:0;text-align:right}
.modal-dialog{width:600px;margin:30px auto}.modal-content{background:white}.modal-header{border-bottom:1px solid #ddd}.modal-header:after{display:table;content:'';clear:both}.modal-title{margin:0;font-size:18px}.close{float:right;font-size:24px;border:0;background:none;cursor:pointer}.modal-footer{border-top:1px solid #ddd}.checkbox{display:inline-block;height:24px;line-height:24px;margin:10px 20px 10px 0}.checkbox ins{display:inline-block;width:23px;height:22px;vertical-align:middle;margin-right:8px;border:1px solid #d8d5d0;background:white}.checkbox .checked{background:#2b8dbe;border-color:#2b8dbe}.checkbox .checked:after{content:'✓';display:block;color:white;text-align:center;font:bold 18px/20px sans-serif}
@media(max-width:767px){.modal-dialog{width:auto;margin:10px}}
</style>
<link rel="stylesheet" href="/src/workspace.css">
<body><div id="basic_setting" role="dialog" aria-labelledby="basicSetting"><div class="modal-dialog text-left"><div class="modal-content">
<div class="modal-header"><button type="button" data-dismiss="modal" aria-label="Close" class="close"><span aria-hidden="true">×</span></button><h4 id="basicSetting" class="modal-title">基本设置</h4></div>
<div class="modal-body"><div class="form-horizontal"><div class="form-group"><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 text-right"><label class="control-label">单组时间限制(ms)[1,30000]：</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><input type="number" min="1" max="30000" id="time_limit" name="time_limit" value="1000" placeholder="时间限制" class="form-control" _value="1000"></div></div></div><div class="form-horizontal"><div class="form-group"><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 text-right"><label class="control-label">内存限制(KB)[1,204800]：</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><input type="number" min="1" max="204800" id="memory_limit" name="memory_limit" value="65536" placeholder="内存限制" class="form-control" _value="65536"></div></div></div><div class="form-horizontal"><div class="form-group"><input type="hidden" id="supported_languages" name="supported_languages" value="c" _value="c"><div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 text-right"><label for="supported_languages" class="control-label"> 支持的语言：</label></div><div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 text-right"><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">c++</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="c++" id="checkbox1" class="checkbox"><ins id="ins1" class="hover"></ins></div></div><br><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">c</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="c" id="checkbox2" class="checkbox"><ins id="ins2" class="checked"></ins></div></div><br><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">java</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="java" id="checkbox3" class="checkbox"><ins id="ins3" class=""></ins></div></div><br><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">python</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="python" id="checkbox4" class="checkbox"><ins id="ins4" class=""></ins></div></div><br><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">python2</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="python2" id="checkbox5" class="checkbox"><ins id="ins5" class=""></ins></div></div><br><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><label class="control-label">python3</label></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-6"><div value="python3" id="checkbox6" class="checkbox"><ins id="ins6" class=""></ins></div></div><br></div></div></div></div>
<div class="modal-footer"><output id="selection" aria-live="polite"></output></div>
</div></div></div>
<script>
// Preview state only; production retains the original iCheck/save handlers.
const choices=[...document.querySelectorAll('.checkbox')];
function showSelection(){document.querySelector('#selection').textContent='已选：'+(choices.filter(e=>e.querySelector('ins').className==='checked').map(e=>e.getAttribute('value')).join(', ')||'无');}
choices.forEach(e=>e.addEventListener('click',()=>{e.querySelector('ins').classList.toggle('checked');showSelection();}));
document.querySelector('.close').hidden=true;showSelection();
window.checkLanguageLayout=()=>{const rows=choices.map(e=>{const control=e.getBoundingClientRect(),label=e.parentElement.previousElementSibling.getBoundingClientRect();return {language:e.getAttribute('value'),aligned:Math.abs(control.y+control.height/2-label.y-label.height/2)<1,within:control.right<=document.documentElement.clientWidth};});if(rows.some(r=>!r.aligned||!r.within))throw Error(JSON.stringify(rows));return rows;};
</script></body></html>
