<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作区浏览器回归</title>
<style>
body{margin:20px;font:14px/1.6 sans-serif;color:#182536}iframe{display:block;height:900px;border:1px solid #dfe5eb;margin:16px 0}pre{white-space:pre-wrap}button{padding:8px 12px;margin-right:8px}
</style>
<h1>工作区浏览器回归</h1>
<p>实际构建产物、延迟加载导航与模拟数据；不访问线上业务数据。</p>
<button data-width="1440">桌面 1440</button><button data-width="1024">平板 1024</button><button data-width="390">窄屏 390</button>
<pre id="result" role="status">正在检查…</pre>
<iframe title="工作区预览" style="width:1440px" src="/contest-ng/index.html#/1326"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
frame.addEventListener('load',async()=>{
  try{
    const script=frame.contentDocument.createElement('script');script.src='/tests/browser-workspace.js';
    await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;frame.contentDocument.body.append(script);});
    const checks=await frame.contentWindow.__workspaceRun;
    result.textContent=`通过 ${Object.keys(checks).length} 项\n`+Object.keys(checks).join('\n');
  }catch(error){result.textContent='失败：'+error.message;}
});
for(const button of document.querySelectorAll('[data-width]'))button.onclick=()=>{frame.style.width=button.dataset.width+'px';};
</script>
</html>
